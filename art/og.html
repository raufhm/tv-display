<!doctype html>
<!-- Link-preview image (1200×630) for LinkedIn, X, Slack…  Rendered to site/img/og.png by art/make-og.sh.
     It's a frozen frame of the hero animation: the window mid-flight, the TV watching, the WOW! sticker. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@700;800&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #fff7e8;
    background-image: radial-gradient(rgba(31,27,22,.08) 1.6px, transparent 1.7px);
    background-size: 26px 26px;
    font-family: "Nunito", sans-serif; color: #1f1b16;
    display: grid; grid-template-columns: 520px 1fr; gap: 10px; align-items: center;
    box-sizing: border-box; padding: 0 40px 0 72px; position: relative;
  }
  body::after { content: ""; position: absolute; inset: 0; border: 10px solid #1f1b16; pointer-events: none; }
  .pill { display: inline-block; font: 800 19px "Nunito"; padding: 6px 18px; border: 3px solid #1f1b16; border-radius: 999px;
    background: #4fd1a5; box-shadow: 4px 4px 0 #1f1b16; transform: rotate(-3deg); margin-bottom: 26px; }
  h1 { font: 700 60px/1.06 "Fredoka"; letter-spacing: -.01em; margin: 0 0 26px; }
  h1 .hl { color: #4b4fe0; position: relative; white-space: nowrap; }
  h1 .hl svg { position: absolute; left: -2%; bottom: -12px; width: 104%; height: 20px; overflow: visible; }
  p { font: 700 25px/1.35 "Nunito"; color: #5d554b; margin: 0 0 30px; }
  .url { display: inline-flex; align-items: center; gap: 12px; font: 600 22px "Fredoka"; padding: 10px 20px;
    border: 3px solid #1f1b16; border-radius: 16px; background: #ffd23f; box-shadow: 5px 5px 0 #1f1b16; }
  .url img { width: 34px; height: 34px; border-radius: 9px; border: 2.5px solid #1f1b16; }
  svg.scene { width: 100%; height: auto; display: block; overflow: visible; }
</style>
</head>
<body>
  <div>

    <p>Drag a window off your laptop and it pops up on the TV. No cables, no ads.</p>
    <span class="url"><img src="../site/img/icon.png" alt="">tv-display-sandy.vercel.app</span>
  </div>
